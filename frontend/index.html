<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema Central de Gestión Operativa de Campuslands: espacios, recursos tecnológicos e incidencias con triaje asistido por IA."
    />
    <title>Campus OPS · Gestión operativa</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Estilos: tokens → base → estructura → componentes → vistas -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />

    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <div class="app">
      <aside class="barra-lateral" aria-label="Navegación principal">
        <div class="marca">
          <span class="marca__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z" /><path d="M3 13l9 5 9-5" /></svg>
          </span>
          <div class="marca__texto">
            <strong>Campus OPS</strong>
            <small>Gestión operativa</small>
          </div>
        </div>

        <nav class="navegacion">
          <a class="navegacion__enlace" href="#/panel" data-ruta="panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5" /><rect x="14" y="3" width="7" height="5" rx="1.5" /><rect x="14" y="12" width="7" height="9" rx="1.5" /><rect x="3" y="16" width="7" height="5" rx="1.5" /></svg>
            <span>Panel</span>
          </a>
          <a class="navegacion__enlace" href="#/espacios" data-ruta="espacios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16" /><path d="M2 21h20M9 21v-4h6v4M8 7h2M14 7h2M8 11h2M14 11h2" /></svg>
            <span>Espacios y reservas</span>
          </a>
          <a class="navegacion__enlace" href="#/recursos" data-ruta="recursos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M2 20h20M9 16v4M15 16v4" /></svg>
            <span>Recursos y préstamos</span>
          </a>
          <a class="navegacion__enlace" href="#/incidencias" data-ruta="incidencias">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01" /><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
            <span>Incidencias · IA</span>
          </a>
          <a class="navegacion__enlace" href="#/datos" data-ruta="datos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" /></svg>
            <span>Datos</span>
          </a>
        </nav>

        <!-- Lo completa main.js con GET /salud -->
        <section class="estado-sistema" id="estado-sistema" aria-live="polite" aria-label="Estado del sistema"></section>
      </aside>

      <!-- La vista activa se dibuja aquí (ver js/router.js) -->
      <main class="contenido" id="contenido" tabindex="-1"></main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
  </body>
</html>
